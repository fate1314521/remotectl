name: Build RemoteCtl Linux App Client

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Linux ${{ matrix.arch }} Client
        run: |
          cd app
          mkdir -p ../output
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w" \
          -o ../output/remotectl-client-linux-${{ matrix.arch }} main.go

      - name: Strip binary
        run: |
          cd output
          strip remotectl-client-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotectl-linux-client-${{ matrix.arch }}
          path: output/remotectl-client-linux-${{ matrix.arch }}
