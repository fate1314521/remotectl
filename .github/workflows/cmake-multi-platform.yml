name: Build RemoteCtl App Linux Client

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Linux client app/${{ matrix.arch }}
        run: |
          cd app
          go mod tidy
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w" \
          -o ../dist/remotectl-client-linux-${{ matrix.arch }} main.go

      - name: Strip binary
        run: |
          cd dist
          strip remotectl-client-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotectl-linux-client-${{ matrix.arch }}
          path: dist/remotectl-client-linux-${{ matrix.arch }}
