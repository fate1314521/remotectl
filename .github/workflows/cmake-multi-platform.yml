name: Build App Linux Client

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build_linux_client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Linux ${{ matrix.arch }} Client
        run: |
          # 强制切换到 app 目录
          cd ./app
          # 在 app 内部执行依赖下载
          go mod tidy
          mkdir -p ../output
          # 交叉编译
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w" \
          -o ../output/remotectl-client-linux-${{ matrix.arch }} main.go

      - name: Strip binary to reduce size
        run: |
          cd output
          strip remotectl-client-linux-${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotectl-client-linux-${{ matrix.arch }}
          path: output/remotectl-client-linux-${{ matrix.arch }}
