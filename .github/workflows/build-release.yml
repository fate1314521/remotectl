name: Build RemoteCtl Multi Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Cross compile all platforms
        run: |
          # 一次性进入工作目录，全程上下文有效
          cd "${GITHUB_WORKSPACE}"
          mkdir -p build_output

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o build_output/remotectl-windows-amd64.exe main.go

          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o build_output/remotectl-darwin-amd64 main.go

          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o build_output/remotectl-darwin-arm64 main.go

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o build_output/remotectl-linux-amd64 main.go

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o build_output/remotectl-linux-arm64 main.go

      - name: Generate SHA256 checksum
        run: |
          cd build_output
          sha256sum * > sha256sums.txt

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/remotectl-windows-amd64.exe
            build_output/remotectl-darwin-amd64
            build_output/remotectl-darwin-arm64
            build_output/remotectl-linux-amd64
            build_output/remotectl-linux-arm64
            build_output/sha256sums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
