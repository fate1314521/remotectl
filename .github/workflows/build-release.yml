name: Build RemoteCtl Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Create output directory
        run: mkdir -p build_output

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w" -o build_output/remotectl-windows-amd64.exe ./cmd/remotectl

      - name: Build Darwin amd64 (Intel Mac)
        env:
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w" -o build_output/remotectl-darwin-amd64 ./cmd/remotectl

      - name: Build Darwin arm64 (Apple Silicon)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags "-s -w" -o build_output/remotectl-darwin-arm64 ./cmd/remotectl

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w" -o build_output/remotectl-linux-amd64 ./cmd/remotectl

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -ldflags "-s -w" -o build_output/remotectl-linux-arm64 ./cmd/remotectl

      - name: Generate SHA256 checksum file
        run: |
          cd build_output
          sha256sum * > sha256sums.txt

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/remotectl-windows-amd64.exe
            build_output/remotectl-darwin-amd64
            build_output/remotectl-darwin-arm64
            build_output/remotectl-linux-amd64
            build_output/remotectl-linux-arm64
            build_output/sha256sums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
