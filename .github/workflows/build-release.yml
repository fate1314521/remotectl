name: Build RemoteCtl All Platform Binaries

# 触发规则
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_binaries:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # 3. 一键编译全部5个平台二进制
      - name: Cross compile all targets
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build_output

          # Windows x86_64
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o build_output/remotectl-windows-amd64.exe main.go

          # macOS Intel x86_64
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o build_output/remotectl-darwin-amd64 main.go

          # macOS Apple Silicon arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o build_output/remotectl-darwin-arm64 main.go

          # Linux x86_64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o build_output/remotectl-linux-amd64 main.go

          # Linux arm64 (树莓派等)
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o build_output/remotectl-linux-arm64 main.go

      # 4. 生成 SHA256 校验和文件（用于你Tauri程序完整性校验）
      - name: Generate SHA256 checksum file
        run: |
          cd build_output
          sha256sum * > sha256sums.txt

      # 5. 自动创建 Release 并上传所有产物
      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/remotectl-windows-amd64.exe
            build_output/remotectl-darwin-amd64
            build_output/remotectl-darwin-arm64
            build_output/remotectl-linux-amd64
            build_output/remotectl-linux-arm64
            build_output/sha256sums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
