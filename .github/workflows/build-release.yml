name: Build and Package RemoteCtl Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-linux:
    name: Build Linux artifacts (server, agent, flutter linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Prepare output dir
        run: |
          set -e
          mkdir -p build_output

      - name: Build server linux/amd64
        run: |
          set -e
          cd server
          echo "Building server linux/amd64"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../build_output/remotectl-server-linux-amd64 .

      - name: Build server linux/arm64
        run: |
          set -e
          cd server
          echo "Building server linux/arm64"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../build_output/remotectl-server-linux-arm64 .

      - name: Build agent linux/amd64
        run: |
          set -e
          cd agent
          echo "Building agent linux/amd64"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../build_output/remotectl-agent-linux-amd64 .

      - name: Install Flutter (for Linux app) and dependencies
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Install linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev libatk1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libglu1-mesa-dev

      - name: Build Flutter Linux desktop (app)
        working-directory: app
        run: |
          set -e
          flutter pub get
          flutter build linux --release
          # Flutter outputs Linux bundle at: build/linux/x64/release/bundle
          mkdir -p ../build_output/app_linux_bundle
          cp -r build/linux/x64/release/bundle/* ../build_output/app_linux_bundle/

      - name: Package Linux App and artifacts
        run: |
          set -e
          cd build_output
          VER="${VERSION}"
          if [ -z "$VER" ]; then VER="dev"; fi

          # Package Linux desktop app (tar.gz)
          if [ -d app_linux_bundle ]; then
            tar -czf "remotectl-app-linux-amd64-${VER}.tar.gz" -C app_linux_bundle .
            rm -rf app_linux_bundle
          else
            echo "Warning:
